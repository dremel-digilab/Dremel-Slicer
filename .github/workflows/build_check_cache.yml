name: Check Cache

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean

jobs:
  check_cache: # determines if there is a cache and outputs variables used in caching process
    name: Check Cache
    runs-on: ${{ inputs.os }}
    outputs:
      cache-key: ${{ steps.set_outputs.outputs.cache-key }}
      cache-path: ${{ steps.set_outputs.outputs.cache-path }}
      valid-cache: ${{ steps.cache_deps.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: "true"

      - name: get timestamp
        id: ts
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: set outputs
        id: set_outputs
        env:
          underscore-arch: ${{ inputs.os == 'macos-13' && '_' || '' }}${{ inputs.os == 'macos-13' && inputs.arch || '' }}
          dash-arch: ${{ inputs.os == 'macos-13' && '-' || '' }}${{ inputs.os == 'macos-13' && inputs.arch || '' }}
          dep-folder-name: ${{ (inputs.os == 'windows-latest' || inputs.os == 'macos-13') && 'Dremel3DSlicer_dep' || 'destdir' }}
          timestamp: ${{ steps.ts.outputs.timestamp }}
          output-cmd: ${{ inputs.os == 'windows-latest' && '$env:GITHUB_OUTPUT' || '"$GITHUB_OUTPUT"' }}
        run: |
          echo cache-key=${{ inputs.os }}${{ env.dash-arch }}-cache-dremelslicer_deps-build-${{ hashFiles('deps/**') }}-${{ env.timestamp }} >> ${{ env.output-cmd }}
          echo cache-path=${{ github.workspace }}/deps/build${{ env.underscore-arch }}/${{ env.dep-folder-name }}${{ env.underscore-arch }} >> ${{ env.output-cmd }}

      - name: load cache
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ${{ steps.set_outputs.outputs.cache-path }}
          key: ${{ steps.set_outputs.outputs.cache-key }}
          lookup-only: true

  build_deps: # call next step
    name: Build Deps
    needs: [check_cache]
    uses: ./.github/workflows/build_deps.yml
    with:
      cache-key: ${{ needs.check_cache.outputs.cache-key }}
      cache-path: ${{ needs.check_cache.outputs.cache-path }}
      valid-cache: ${{ needs.check_cache.outputs.valid-cache == 'true' }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit
