name: Check Cache

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean
  
jobs:
  check_cache: # determines if there is a cache and outputs variables used in caching process
    name: Check Cache
    runs-on: ${{ inputs.os }}
    outputs:
      cache-key: ${{ steps.set_outputs.outputs.cache-key }}
      cache-path: ${{ steps.set_outputs.outputs.cache-path }}
      valid-cache: ${{ steps.cache_deps.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'
        
      - name: set outputs
        id: set_outputs
        env:
          underscore-arch: ${{ inputs.os == 'macos-15' && '_' || ''}}${{ inputs.os == 'macos-15' && inputs.arch || '' }} # if is macos, make a string that does "_{arch}", else output nothing
          dash-arch: ${{ inputs.os == 'macos-15' && '-' || ''}}${{ inputs.os == 'macos-15' && inputs.arch || '' }} # if is macos, make a string that does "-{arch}", else output nothing
          dep-folder-name: ${{ (inputs.os == 'windows-latest' || inputs.os == 'macos-15') && 'Dremel3DSlicer_dep' || 'destdir' }}
          output-cmd: ${{ inputs.os == 'windows-latest' && '$env:GITHUB_OUTPUT' || '"$GITHUB_OUTPUT"'}}
        run: |
          echo cache-key=${{ inputs.os }}${{ env.dash-arch }}-cache-dremelslicer_deps-build-${{ hashFiles('deps/**') }} >> ${{ env.output-cmd }}
          echo cache-path=${{ github.workspace }}/deps/build${{ env.underscore-arch }}/${{ env.dep-folder-name }}${{ env.underscore-arch }} >> ${{ env.output-cmd }}
            
      - name: load cache
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ${{ steps.set_outputs.outputs.cache-path }}
          key: no-cache-${{ github.run_id }}
          #key: ${{ steps.set_outputs.outputs.cache-key }}
          lookup-only: true

      - name: Clean Clang, Xcode, and Derived Data
        run: |
          echo "Cleaning derived data..."
          rm -rf ~/Library/Developer/Xcode/DerivedData
      
          echo "Cleaning clang caches..."
          rm -rf ~/.cache/clang
          rm -rf ~/Library/Caches/com.apple.dt.Xcode
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf /Users/runner/Library/Developer/Xcode/DerivedData/*
          rm -rf /Users/runner/Library/Caches/com.apple.dt.Xcode
      
          echo "Cleaning CMake build directories..."
          find . -type d -name "CMakeFiles" -exec rm -rf {} +
          find . -type f -name "CMakeCache.txt" -exec rm -f {} +
      
          echo "Cleaning ninja build output..."
          find . -type d -name ".ninja*" -exec rm -rf {} +
      
          echo "Cleaning general build output..."
          find . -type d -name "build" -exec rm -rf {} +
        
        
  build_deps: # call next step
    name: Build Deps
    needs: [check_cache]
    uses: ./.github/workflows/build_deps.yml
    with:
      cache-key: ${{ needs.check_cache.outputs.cache-key }}
      cache-path: ${{ needs.check_cache.outputs.cache-path }}
      valid-cache: ${{ needs.check_cache.outputs.valid-cache == 'true' }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit
